# This file deploys the HearMe production build to Firebase Hosting
# when changes are pushed to the main branch.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build HearMe
        run: npm run build
        env:
          REACT_APP_GOOGLE_TRANSLATE_KEY: ${{ secrets.REACT_APP_GOOGLE_TRANSLATE_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEARME_D7BD1 }}
          channelId: live
          projectId: hearme-d7bd1